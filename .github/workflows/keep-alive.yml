# يزور الموقع كل 3 ساعات مثل أي زائر:
# - إذا كان نائمًا يضغط زر الإيقاظ وينتظر حتى يشتغل.
# - إذا لم يفتح (نائم لم يصحُ، خطأ، أو رسالة منع وصول) يفشل التشغيل،
#   فيرسل GitHub رسالة بريد لصاحب المستودع، ومعها صورة للصفحة في Artifacts.
name: keep-alive
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Open the website and check it loads
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python .github/keepalive.py
      - name: Save a screenshot of the failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-failure
          path: keepalive_failure.png
          if-no-files-found: ignore
